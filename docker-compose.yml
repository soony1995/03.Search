version: '3.8'

services:
  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: search-elasticsearch
    # Install analysis-nori so `nori_tokenizer` works (used by `photos` index mapping).
    # This runs before Elasticsearch starts inside the container.
    command:
      - bash
      - -lc
      - |
        if ! bin/elasticsearch-plugin list | grep -q '^analysis-nori$'; then
          bin/elasticsearch-plugin install --batch analysis-nori
        fi
        exec /usr/local/bin/docker-entrypoint.sh eswrapper
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      # NOTE: Elasticsearch SQL JDBC/ODBC is license-gated. Enable a dev trial license so tools like DBeaver can use JDBC.
      # If you already have an existing `es_data` volume, either start the trial once via:
      #   POST http://localhost:9200/_license/start_trial?acknowledge=true
      # or recreate the volume (`docker-compose down -v`) to apply the self-generated license type.
      - xpack.license.self_generated.type=trial
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - 10_modules
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Search Service (Node.js)
  search-service:
    build:
      context: ./search-service
      dockerfile: Dockerfile
    container_name: search-service
    ports:
      - "4002:4002"
    environment:
      PORT: 4002
      ELASTICSEARCH_URL: http://elasticsearch:9200
      REDIS_URL: redis://media-redis:6379
      AI_POSTGRES_URL: postgres://ai:ai_password@ai-postgres:5432/ai_db
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - 10_modules
    restart: unless-stopped

networks:
  10_modules:
    external: true

volumes:
  es_data:
